name: AEGIS CI
# Budget-conscious CI: drafts and each intermediate commit do not automatically run CI.
# Run quick checks once when a PR is marked ready for review, or manually.
on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      run_compose:
        description: "Also run full Docker Compose integration smoke test (slower)"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: aegis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Test exercise API
        working-directory: services/api
        run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-aegis-${{ hashFiles('apps/web/package-lock.json', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-aegis-
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
  compose-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_compose == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start exercise stack
        run: docker compose up --build -d
      - name: Verify health, seed data, frontend
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            docker compose ps
            docker compose logs --tail=100
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/api/incidents > /tmp/aegis-incidents.json
          python -c 'import json; rows=json.load(open("/tmp/aegis-incidents.json")); assert len(rows)>=5, rows; print("Seeded exercise incidents:",len(rows))'
          curl -fsS http://127.0.0.1:3000/api/telemetry > /tmp/aegis-telemetry.json
          python -c 'import json; data=json.load(open("/tmp/aegis-telemetry.json")); assert data["source"]=="synthetic_fixture"'
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose logs --tail=120
      - name: Clean up ephemeral CI containers
        if: always()
        run: docker compose down -v --remove-orphans
