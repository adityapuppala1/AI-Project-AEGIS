name: AEGIS CI
# Opt-in only: no CI on pushes, PR creation, updates or ready-for-review.
# Apply PR label ci:api / ci:web / ci:all *only when explicitly needed*.
# Remove and reapply the label to request a later run. Full Docker is manual only.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: "Only run the checks selected (saves runner minutes)"
        type: choice
        required: true
        default: api
        options:
          - api
          - web
          - all
      run_compose:
        description: "Also run full Docker Compose integration smoke test (expensive)"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: aegis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    if: ${{ (github.event_name == 'pull_request' && (github.event.label.name == 'ci:api' || github.event.label.name == 'ci:all')) || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'api' || inputs.suite == 'all')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate local Compose manifest (no containers built)
        run: docker compose config --quiet
      - name: Install API dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Test exercise API
        working-directory: services/api
        run: python -m pytest -q
      - name: Verify committed synthetic evaluation report
        working-directory: services/api
        run: python -m app.model_lab --check
  web:
    if: ${{ (github.event_name == 'pull_request' && (github.event.label.name == 'ci:web' || github.event.label.name == 'ci:all')) || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'web' || inputs.suite == 'all')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-aegis-${{ hashFiles('apps/web/package-lock.json', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-aegis-
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
  compose-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_compose == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start exercise stack
        run: docker compose up --build -d
      - name: Verify health, seed data, frontend
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            docker compose ps
            docker compose logs --tail=100
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/api/incidents > /tmp/aegis-incidents.json
          python -c 'import json; rows=json.load(open("/tmp/aegis-incidents.json")); assert len(rows)>=5, rows; print("Seeded exercise incidents:",len(rows))'
          curl -fsS http://127.0.0.1:3000/api/telemetry > /tmp/aegis-telemetry.json
          python -c 'import json; data=json.load(open("/tmp/aegis-telemetry.json")); assert data["source"]=="synthetic_fixture"'
      - name: Exercise end-to-end schema and fixture checks
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T api python -m app.doctor
          docker compose exec -T api python -m app.migration_audit
          curl -fsS http://127.0.0.1:8000/v1/exercise/system/readiness > /tmp/aegis-ready.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/aegis-ready.json"))
          assert data["status"] == "ready", data
          for name, minimum in {
              "incidents": 5, "sources": 4, "source_samples": 24,
              "timeline_events": 7, "evidence": 5, "geo_assets": 5,
          }.items():
              assert data["fixture_counts"][name] >= minimum, (name, data)
          PY
          curl -fsS http://127.0.0.1:8000/v1/exercise/model-lab/report > /tmp/aegis-model.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/aegis-model.json"))
          assert data["source"] == "synthetic_generated_fixture"
          assert data["calibrated_real_world_probability"] is False
          PY
          curl -fsS http://127.0.0.1:3000/api/sources > /tmp/aegis-sources.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/aegis-sources.json"))
          assert data["source"] == "synthetic_exercise"
          assert data["real_connectors_enabled"] is False
          PY
          curl -fsS "http://127.0.0.1:8000/v1/exercise/incidents/22222222-2222-4222-8222-222222222222/readiness" > /tmp/aegis-assessment.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/aegis-assessment.json"))
          assert data["real_world_risk_probability"] is None
          assert data["operational_actions_enabled"] is False
          PY
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/v1/live/public-warning)
          test "$code" = 403
      - name: Verify replay idempotency in temporary CI volume
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T api python -m app.replay > /tmp/aegis-first-replay.json
          docker compose exec -T api python -m app.replay > /tmp/aegis-repeat-replay.json
          python - <<'PY'
          import json
          a=json.load(open("/tmp/aegis-first-replay.json"))
          b=json.load(open("/tmp/aegis-repeat-replay.json"))
          assert (a["accepted"], a["duplicate"], a["quarantined"]) == (3, 1, 5), a
          assert (b["accepted"], b["duplicate"], b["quarantined"]) == (0, 4, 5), b
          PY
          docker compose exec -T api python -m app.doctor
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose logs --tail=120
      - name: Clean up ephemeral CI containers
        if: always()
        run: docker compose down -v --remove-orphans
