name: ai-project-aegis
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_local_only}
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/migrations/002_governance.sql:/docker-entrypoint-initdb.d/002-governance.sql:ro
      - ./db/migrations/003_identity_scopes.sql:/docker-entrypoint-initdb.d/003-identity-scopes.sql:ro
      - ./db/migrations/004_incident_search.sql:/docker-entrypoint-initdb.d/004-incident-search.sql:ro
      - ./db/migrations/005_incident_intelligence.sql:/docker-entrypoint-initdb.d/005-incident-intelligence.sql:ro
      - ./db/migrations/006_exercise_source_health.sql:/docker-entrypoint-initdb.d/006-source-health.sql:ro
      - ./db/migrations/007_exercise_ingestion.sql:/docker-entrypoint-initdb.d/007-exercise-ingestion.sql:ro
      - ./db/migrations/008_exercise_geospatial.sql:/docker-entrypoint-initdb.d/008-exercise-geospatial.sql:ro
      - ./db/migrations/009_exercise_agency_sync.sql:/docker-entrypoint-initdb.d/009-exercise-agency-sync.sql:ro
      - ./db/migrations/010_exercise_source_comparison.sql:/docker-entrypoint-initdb.d/010-exercise-source-comparison.sql:ro
      - ./db/seed_intelligence.sql:/docker-entrypoint-initdb.d/011-intelligence-seed.sql:ro
      - ./db/seed_sources.sql:/docker-entrypoint-initdb.d/012-source-seed.sql:ro
      - ./db/seed_geospatial.sql:/docker-entrypoint-initdb.d/013-geo-seed.sql:ro
      - ./db/seed_agency_sync.sql:/docker-entrypoint-initdb.d/014-agency-sync-seed.sql:ro
      - ./db/migrations/011_public_intake_quarantine.sql:/docker-entrypoint-initdb.d/015-public-intake.sql:ro
      - ./db/migrations/012_proactive.sql:/docker-entrypoint-initdb.d/016-proactive.sql:ro
      - ./db/migrations/013_proactive_run_agency.sql:/docker-entrypoint-initdb.d/017-proactive-run-agency.sql:ro
      - ./db/migrations/014_proactive_scheduler.sql:/docker-entrypoint-initdb.d/018-proactive-scheduler.sql:ro
      - ./db/migrations/015_exposure.sql:/docker-entrypoint-initdb.d/019-exposure.sql:ro
      - ./db/seed_exposure.sql:/docker-entrypoint-initdb.d/020-exposure-seed.sql:ro
      - ./db/migrations/016_learning_drills.sql:/docker-entrypoint-initdb.d/021-learning-drills.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/010-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      retries: 15
    # PostgreSQL is reachable only inside the Compose network at db:5432.
    # Do not publish host port 5432: Windows may reserve it, and the API
    # already connects internally through DATABASE_URL.
    mem_limit: 1g
  migrate:
    image: postgis/postgis:16-3.4
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-aegis_local_only}
    volumes:
      - ./db/schema.sql:/schema.sql:ro
      - ./db/migrations/002_governance.sql:/migration.sql:ro
      - ./db/migrations/003_identity_scopes.sql:/identity-scopes.sql:ro
      - ./db/migrations/004_incident_search.sql:/incident-search.sql:ro
      - ./db/migrations/005_incident_intelligence.sql:/incident-intelligence.sql:ro
      - ./db/migrations/006_exercise_source_health.sql:/source-health.sql:ro
      - ./db/migrations/007_exercise_ingestion.sql:/ingestion.sql:ro
      - ./db/migrations/008_exercise_geospatial.sql:/geospatial.sql:ro
      - ./db/migrations/009_exercise_agency_sync.sql:/agency-sync.sql:ro
      - ./db/migrations/010_exercise_source_comparison.sql:/source-comparison.sql:ro
      - ./db/migrations/011_public_intake_quarantine.sql:/public-intake.sql:ro
      - ./db/migrations/012_proactive.sql:/proactive.sql:ro
      - ./db/migrations/013_proactive_run_agency.sql:/proactive-run-agency.sql:ro
      - ./db/migrations/014_proactive_scheduler.sql:/proactive-scheduler.sql:ro
      - ./db/migrations/015_exposure.sql:/exposure.sql:ro
      - ./db/migrations/016_learning_drills.sql:/learning-drills.sql:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /schema.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /migration.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /identity-scopes.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /incident-search.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /incident-intelligence.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /source-health.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /ingestion.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /geospatial.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /agency-sync.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /source-comparison.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /public-intake.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /proactive.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /proactive-run-agency.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /proactive-scheduler.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /exposure.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /learning-drills.sql"]
    restart: "no"
  seed:
    image: postgis/postgis:16-3.4
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-aegis_local_only}
    volumes:
      - ./db/seed.sql:/seed.sql:ro
      - ./db/seed_intelligence.sql:/seed-intelligence.sql:ro
      - ./db/seed_sources.sql:/seed-sources.sql:ro
      - ./db/seed_geospatial.sql:/seed-geospatial.sql:ro
      - ./db/seed_agency_sync.sql:/seed-agency-sync.sql:ro
      - ./db/seed_exposure.sql:/seed-exposure.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-c", "psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /seed.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /seed-intelligence.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /seed-sources.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /seed-geospatial.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /seed-agency-sync.sql && psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /seed-exposure.sql"]
    restart: "no"
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD:-aegis_local_only}@db:5432/aegis
      CORS_ORIGIN: http://localhost:3000
      # These are nonsecret public OIDC metadata; absent config fails closed.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      BFF_SESSION_KEY_BASE64: ${BFF_SESSION_KEY_BASE64:-}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
volumes:
  pgdata:
