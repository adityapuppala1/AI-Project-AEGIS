services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_local_only}
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/migrations/002_governance.sql:/docker-entrypoint-initdb.d/015-governance.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      retries: 15
    # PostgreSQL is reachable only inside the Compose network at db:5432.
    # Do not publish host port 5432: Windows may reserve it, and the API
    # already connects internally through DATABASE_URL.
    mem_limit: 1g
  seed:
    image: postgis/postgis:16-3.4
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-aegis_local_only}
    volumes:
      - ./db/seed.sql:/seed.sql:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "psql -h db -U aegis -d aegis -v ON_ERROR_STOP=1 -f /seed.sql"]
    restart: "no"
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD:-aegis_local_only}@db:5432/aegis
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1g
volumes:
  pgdata:
