# AEGIS look for the LOCAL exercise identity provider's sign-in pages (Keycloak login theme).
# It only restyles Keycloak's own pages: the form, its fields and its security behaviour are Keycloak's, unchanged.
# Mounted by compose.local-idp.yaml and selected for the realm by scripts/update-local-idp.ps1.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/aegis.css
