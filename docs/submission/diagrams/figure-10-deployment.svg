<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1460" role="img" aria-label="Two columns. Left, today: one laptop running Docker Compose with web, API, database and a local demo identity provider. Right, not yet built: hosting in India, a production identity provider, high availability and backups, an independent security audit, accessibility certification, logging duties, data agreements and more." data-key="d9"><style>svg.dg{--d-bg:#FFFFFF;--d-panel:#F2F5F9;--d-card:#FFFFFF;--d-line:#8D9DBB;--d-ink:#0C183D;--d-mute:#48567A;
--d-acc:#163E96;--d-accbg:#E6EDFB;--d-ok:#17803D;--d-okbg:#E4F4EA;--d-warn:#A35004;--d-warnbg:#FDF0DC;--d-warnline:#D9801A;
--d-no:#B42318;--d-nobg:#FDECEA;--d-r-maker:#1A62A6;--d-r-checker:#15783A;--d-r-auditor:#475569;--d-r-dept:#0D6E67;--d-r-team:#9D174D;--d-r-admin:#A35004;}
.dg{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.dg .bg{fill:var(--d-bg)}
.dg .panel{fill:var(--d-panel);stroke:var(--d-line);stroke-width:1.5}
.dg .card{fill:var(--d-card);stroke:var(--d-line);stroke-width:2}
.dg .soft{fill:var(--d-panel);stroke:var(--d-line);stroke-width:1.5}
.dg .sw{fill:var(--d-accbg);stroke:var(--d-acc);stroke-width:2}
.dg .human{fill:var(--d-warnbg);stroke:var(--d-warnline);stroke-width:2.5}
.dg .data{fill:var(--d-okbg);stroke:var(--d-ok);stroke-width:2}
.dg .opt{fill:var(--d-card);stroke:var(--d-acc);stroke-width:2;stroke-dasharray:9 6}
.dg .no{fill:var(--d-nobg);stroke:var(--d-no);stroke-width:2.5;stroke-dasharray:9 6}
.dg .todo{fill:var(--d-panel);stroke:var(--d-mute);stroke-width:2;stroke-dasharray:3 6}
.dg .bound{fill:none;stroke:var(--d-mute);stroke-width:2;stroke-dasharray:14 8}
.dg .t{fill:var(--d-ink)}
.dg .tm{fill:var(--d-mute)}
.dg .tacc{fill:var(--d-acc)}
.dg .twarn{fill:var(--d-warn)}
.dg .tno{fill:var(--d-no)}
.dg .tok{fill:var(--d-ok)}
.dg .b{font-weight:700}
.dg .ln{fill:none;stroke:var(--d-mute);stroke-width:2.5}
.dg .lacc{fill:none;stroke:var(--d-acc);stroke-width:2.5}
.dg .lopt{fill:none;stroke:var(--d-acc);stroke-width:2.5;stroke-dasharray:9 6}
.dg .lno{fill:none;stroke:var(--d-no);stroke-width:2.5;stroke-dasharray:9 6}
.dg .lwarn{fill:none;stroke:var(--d-warnline);stroke-width:3}
.dg .m-ln{fill:var(--d-mute)} .dg .m-acc{fill:var(--d-acc)} .dg .m-warn{fill:var(--d-warnline)} .dg .m-no{fill:var(--d-no)}
.dg .dot{fill:var(--d-ink)}
.dg .r-maker{fill:var(--d-r-maker)} .dg .r-checker{fill:var(--d-r-checker)} .dg .r-auditor{fill:var(--d-r-auditor)}
.dg .r-dept{fill:var(--d-r-dept)} .dg .r-team{fill:var(--d-r-team)} .dg .r-admin{fill:var(--d-r-admin)}
.dg .badge{fill:var(--d-ink)} .dg .badget{fill:var(--d-bg)}
.dg .hit{fill:transparent}
.dg [data-node]{cursor:pointer}
.dg [data-node]:focus-visible .card,.dg [data-node]:focus-visible .sw,.dg [data-node]:focus-visible .opt{stroke:var(--d-warnline);stroke-width:5}
.dg [data-node].on .card,.dg [data-node].on .sw,.dg [data-node].on .opt,.dg [data-node].on .data,.dg [data-node].on .human{stroke:var(--d-warnline);stroke-width:5}
.dg .dim{opacity:.28}
</style><defs>
<marker id="d9a-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="m-ln"/></marker>
